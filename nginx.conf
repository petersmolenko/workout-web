# nginx внутри контейнера app: раздаёт статику приложения и проксирует
# запросы /api/* в контейнер сервера. Всё закрыто basic-аутентификацией
# (файл htpasswd монтируется из корня проекта, см. docker-compose.yml).
server {
    listen 80;

    # gzip: JS-бандл ~740КБ сжимается до ~110КБ — быстрее загрузка,
    # меньше пакетов, меньше чувствительность к проблемам сети.
    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    auth_basic "Workout";
    auth_basic_user_file /etc/nginx/htpasswd;

    # статика Vue-приложения
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri /index.html;
    }

    # /api/... -> server:8000/...  (трейлинг-слэш в proxy_pass срезает /api)
    location /api/ {
        proxy_pass http://server:8000/;
        proxy_set_header Host $host;
        # генерация ждёт ответа Claude до полуминуты — не рвать соединение
        proxy_read_timeout 180s;
    }
}
