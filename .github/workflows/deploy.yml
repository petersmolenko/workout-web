# CI/CD приложения: push в main → на VPS обновляется и пересобирается
# ТОЛЬКО контейнер web (сервер не трогаем).
#
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   VPS_HOST, VPS_USER, VPS_SSH_KEY
name: Deploy web

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/workout/web && git pull --ff-only
            cd /opt/workout && docker compose up -d --build web
            docker image prune -f
